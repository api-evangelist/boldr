aid: boldr
name: Boldr
description: >-
  Boldr is a Techstars-backed consumer hardware company building energy-saving
  smart home climate control devices. Its two products are Kelvin, a smart
  infrared heater, and Klima, a smart thermostat controller for mini-split air
  conditioners that also monitors appliance health so units last longer with
  fewer issues. Both devices are managed through the Boldr mobile app, which
  lets homeowners control climate settings remotely and track energy usage to
  lower utility bills. Boldr also runs Boldr Pro, a program for HVAC
  contractors. The company sells direct to consumers through a Shopify-hosted
  online store at shopboldr.com and does not currently publish a first-party
  developer API; its only public machine-readable surface is the Shopify
  Customer Account OIDC discovery served at the storefront host.
